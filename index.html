:13px}\n.mesa-top .ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.mesa{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}\n.mesa>*{min-width:0}\n\n.stage{position:relative;border-radius:26px;padding:20px 22px 18px;overflow:hidden;\n  background:radial-gradient(520px 240px at 50% 105%,rgba(242,184,75,.10),transparent 70%),linear-gradient(180deg,#151a29,#0d1019);\n  border:1px solid var(--line);box-shadow:0 30px 80px -40px rgba(0,0,0,.8)}\n.stage:before{content:\"\";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 64px);pointer-events:none}\n.stage.g{background:radial-gradient(520px 260px at 50% 105%,rgba(242,184,75,.22),transparent 70%),linear-gradient(180deg,#191a24,#0d1019)}\n.stage.c{background:radial-gradient(520px 260px at 50% 105%,rgba(127,178,186,.22),transparent 70%),linear-gradient(180deg,#141b25,#0d1019)}\n.st-head{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}\n.st-id small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}\n.st-id b{font-family:var(--mono);font-size:13.5px;font-weight:600;color:#dfe4ee}\n.clock{text-align:right}\n.clock .ph{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(111,227,195,.1);color:var(--ok)}\n.clock .ph:before{content:\"\";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:blink 1.4s infinite}\n@keyframes blink{50%{opacity:.35}}\n.clock .sec{display:block;font-size:40px;font-weight:850;line-height:1.05;margin-top:6px;letter-spacing:-.02em}\n.clock .sec small{font-size:15px;color:var(--mut);font-weight:700;margin-left:2px}\n.clock .lab{font-size:12px;color:var(--mut)}\n.r28[data-phase=lock] .clock .ph{background:rgba(255,149,72,.12);color:var(--lock)}\n.r28[data-phase=lock] .clock .sec{color:var(--lock)}\n.r28[data-phase=draw] .clock .ph,.r28[data-phase=pay] .clock .ph{background:rgba(242,184,75,.12);color:var(--gold)}\n.r28[data-phase=prep] .clock .ph{background:rgba(185,164,255,.12);color:var(--par)}\n.timeline{position:relative;display:flex;gap:4px;margin:14px 0 4px}\n.timeline .tl{position:relative;height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}\n.timeline .tl i{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,0));background:var(--ok);transition:transform .25s linear}\n.timeline .tl.l i{background:var(--lock)} .timeline .tl.d i{background:var(--gold)}\n.tl-lab{position:relative;display:flex;justify-content:space-between;font-size:11px;color:var(--mut2);font-weight:700;letter-spacing:.04em;text-transform:uppercase}\n.tl-lab span.on{color:var(--ink)}\n.draw-row{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.8vw,20px);padding:22px 0 10px}\n.ball{position:relative;width:clamp(62px,8vw,104px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;\n  background:radial-gradient(circle at 32% 26%,#fff 0,#f7f0e1 26%,#dccba4 66%,#9a8356 100%);\n  box-shadow:inset -8px -12px 20px rgba(60,40,10,.28),inset 4px 6px 10px rgba(255,255,255,.6),0 18px 30px -8px rgba(0,0,0,.6)}\n.ball:after{content:\"\";position:absolute;left:18%;right:18%;bottom:-16px;height:10px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(6px)}\n.ball .num{font-weight:900;font-size:clamp(30px,4vw,52px);color:#171722;transform:scale(.72);opacity:.5;transition:transform .45s cubic-bezier(.2,1.7,.35,1),opacity .2s}\n.ball.q .num{color:#8b7a57;opacity:.8;transform:scale(.8)}\n.ball.rolling{animation:roll .42s linear infinite}\n.ball.rolling .num{filter:blur(1.4px)}\n.ball.land{animation:none}\n.ball.land .num{transform:scale(1);opacity:1;filter:none}\n@keyframes roll{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7 /*
 * Ronda 28 · Capa de actividad de apuestas ("heat")
 * ------------------------------------------------------------------
 * Este módulo SOLO muestra actividad de otros jugadores. No tiene acceso a:
 *   - la semilla (server_seed) ni al cálculo del sorteo (Draw.draw),
 *   - el saldo del jugador, sus apuestas ni su liquidación,
 *   - ninguna lógica de "balanceo" de la casa (no existe en este producto).
 * Recibe únicamente datos públicos de la ronda (periodo, sala, horas de apertura
 * y Bloqueo) y, DESPUÉS del sorteo, el resultado ya publicado para calcular el
 * resumen con los multiplicadores fijos (Draw.settle, de solo lectura).
 *
 * ADAPTADOR DE FEED (producción) — forma del objeto:
 *
 *   const feed = {
 *     name: 'mi-feed',            // texto libre para depuración
 *     simulated: false,           // true => la UI etiqueta todo como "Datos de ejemplo (demo)"
 *     // Se llama una vez por ronda, al abrir apuestas. Debe devolver una función para cancelar.
 *     subscribe(round, onEvent) { ...; return () => {...} },
 *   };
 *
 *   round (congelado, solo lectura):
 *     { period: 'R28-20261112-120001-1m', room: '1m'|'3m', openAt: <ms epoch>, lockAt: <ms epoch> }
 *
 *   onEvent(ev) acepta:
 *     { type: 'bet', period, user: 'Ju***z', option: 'Grande', amount: 200, at: <ms epoch> }
 *        - user llega YA enmascarado desde el servidor (nunca nombres completos).
 *        - option es uno de los nombres de Draw.odds ('Grande','Chico','Par','Impar',
 *          'Chico impar','Chico par','Grande impar','Grande par','Extremo chico',

 *        - amount en MXN (número). Eventos con periodo distinto, opción desconocida o
 *          monto inválido se ignoran.
 *     { type: 'summary', period, winners, paid, bigWins: [{user, option, amount, payout}] }   (opcional)
 *        - si el servidor manda su propio resumen post-sorteo, la UI lo usa tal cual;
 *          si no, la UI lo calcula con R28Heat.summarize() sobre las apuestas recibidas.
 *
 * Activación (ver README):
 *   window.R28_CONFIG = { betsFeed: <adaptador real> }   -> usa el feed real.
 *   window.R28_CONFIG = { demoHeat: true }               -> usa el simulador de este archivo.
 *   Ninguno de los dos                                  -> los módulos de actividad se OCULTAN.
 *   Nunca se cae a datos falsos si no hay feed real y la bandera demo está apagada.
 *
 * SIMULADOR (solo demo): pseudoaleatorio determinista derivado del period_id

  wins.sort((a,b)=>b.payout-a.payout);
  // "Gran premio": retorno >= $500 o multiplicador >= 12.65 (suma exacta, extremos, Trío).
  const bigWins=wins.filter(w=>w.payout>=500||draw.odds[w.option]>=12.65).slice(0,3);
  return {winners:winners.size,paid:Math.round(paid*100)/100,bigWins,bets:bets.length};
}

g.R28Heat={createSimulatedFeed,simulateRound,summarize,mask,_prng:prng};
if(typeof module!=='undefined')module.exports=g.R28Heat;
})(globalThis);

<script>
/*
 * Ronda 28 · Capa social / planes públicos (KOL)
 * ------------------------------------------------------------------
 * Muestra planes de contraste públicos, seguir/dejar de seguir y
 * «Usar en esta ronda» con confirmación del jugador.
 * NO copia apuestas en silencio ni en rondas siguientes.
 * NO toca la semilla, Draw.draw, ni la liquidación; solo escribe
 * filas de contraste de los planes KOL y, si el jugador confirma,
 * una apuesta por el camino normal (placeDirect en r28.js).
 *
 * ADAPTADOR (producción) — forma del objeto:
 *
 *   const feed = {
 *     name: 'mi-kol-feed',
 *     simulated: false,          // true => la UI etiqueta "Datos de ejemplo (demo)"
 *     list() {                   // instantánea de perfiles y su plan público
 *       return [{
 *         id, handle, verified: true, followers,
 *         market: 'size'|'parity'|'combo', room: '1m'|'3m',
 *         rows: [{pick, period, actual, sum, hit}, ...]  // hasta 10
 *       }];
 *     }
 *   };
 *   window.R28_CONFIG = { kolFeed: feed };
 *
 * Activación (igual que demoHeat):
 *   window.R28_CONFIG = { kolFeed: <adaptador real> }  -> usa el feed real.
 *   window.R28_CONFIG = { demoSocial: true }           -> roster demo de este archivo.
 *   Ninguno de los dos                                 -> la página explica que no hay planes públicos.
 *   Nunca se inventan datos en vivo si la bandera demo está apagada y no hay feed.
 *
 * DEMO: PRNG determinista (xmur3 + mulberry32) con semilla 'r28-social|'+id.
 * Usa R28Heat._prng si existe (mismo algoritmo que heat.js). Nunca Math.random
 * ni la semilla del sorteo. El contraste de rondas pasadas se hace contra hist[]
 * ya publicado (p. ej. las 36 de demostración).
 */
(function(g){
'use strict';
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}}
function prng(key){return (g.R28Heat&&g.R28Heat._prng)?g.R28Heat._prng(key):mulberry32(xmur3(key)())}

const STORE='r28.follows';
const PAST=6,N=10;
const MARKETS={size:{name:'Grande / Chico',opts:['Grande','Chico']},parity:{name:'Par / Impar',opts:['Par','Impar']},combo:{name:'Combinación',opts:['Chico impar','Chico par','Grande impar','Grande par']}};
const SPEC=[
  {id:'luna',handle:'Luna_mx',market:'size',room:'1m'},
  {id:'rex',handle:'Rex.28',market:'parity',room:'1m'},
  {id:'noche',handle:'NocheClara',market:'combo',room:'3m'}
];
const FIXED='Los resultados anteriores no determinan los siguientes. Un plan solo te ayuda a contrastar, no predice el sorteo.';
const CHIPS=[5,10,20,50,100];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){const neg=n<0;const [i,d]=Math.abs(n).toFixed(2).split('.');return (neg?'-':'')+'$'+i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+d}
function fmtN(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function pct(n,d=0){return (n*100).toFixed(d)+'%'}
function marketValue(m,r){return m==='size'?r.size:m==='parity'?r.parity:r.combination}
function roomLab(room){return 'Sala '+(room==='3m'?'3 min':'1 min')}
function demoTag(){return '<span class="demo-tag">Datos de ejemplo (demo)</span>'}
function vbadge(){return '<span class="vbadge" title="Verificado" aria-label="Verificado"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6.2 11.1 3.4 8.3l1.1-1.1 1.7 1.7 4.3-4.4 1.1 1.1z" fill="currentColor"/></svg></span>'}

function emptyRow(pick){return {pick,period:null,actual:null,sum:null,hit:null}}

function buildDemoKol(spec){
  const r=prng('r28-social|'+spec.id);
  const opts=MARKETS[spec.market].opts;
  const followers=1200+Math.floor(r()*16800);
  const picks=[];let cur=opts[Math.floor(r()*opts.length)];
  for(let i=0;i<N;i++){if(r()>=0.58)cur=opts[Math.floor(r()*opts.length)];picks.push(cur)}
  return {id:spec.id,handle:spec.handle,verified:true,followers,market:spec.market,room:spec.room,simulated:true,histBound:false,
    rows:picks.map(emptyRow)};
}

function createDemoRoster(){return SPEC.map(buildDemoKol)}

const ST={cfg:{demoSocial:false,kolFeed:null},list:[],tab:'destacados',modal:null,demo:false,active:false};

function loadFollows(){
  try{const raw=JSON.parse(g.localStorage.getItem(STORE)||'[]');if(Array.isArray(raw))return raw.map(String)}catch(e){}
  return [];
}
function saveFollows(ids){try{g.localStorage.setItem(STORE,JSON.stringify(ids))}catch(e){}}
function follows(){return loadFollows().filter(id=>ST.list.some(k=>k.id===id))}
function isFollowed(id){return follows().includes(id)}
function toggleFollow(id){
  if(!ST.list.some(k=>k.id===id))return follows();
  let ids=follows();
  if(ids.includes(id))ids=ids.filter(x=>x!==id);else ids=ids.concat([id]);
  saveFollows(ids);return ids;
}

function activate(cfg){
  ST.cfg=Object.assign({demoSocial:false,kolFeed:null},cfg||{});
  const feed=ST.cfg.kolFeed;
  ST.active=!!(feed||ST.cfg.demoSocial===true);
  ST.demo=ST.cfg.demoSocial===true&&!feed;
  if(feed&&typeof feed.list==='function'){
    try{ST.list=(feed.list()||[]).map(k=>Object.assign({verified:true,rows:[],histBound:true,simulated:!!feed.simulated},k))}catch(e){ST.list=[]}
  }else if(ST.demo)ST.list=createDemoRoster();
  else ST.list=[];
}

function bindHistory(hist){
  if(!hist)return;
  for(const k of ST.list){
    if(k.histBound)continue;
    const h=hist[k.room]||[];
    if(!h.length)continue;
    const past=h.slice(0,Math.min(PAST,h.length,k.rows.length)).slice().reverse();
    for(let i=0;i<past.length;i++){
      const r=past[i];if(!r)continue;
      const row=k.rows[i];if(!row||row.actual!=null)continue;
      row.period=r.period;row.actual=marketValue(k.market,r);row.sum=r.sum;row.hit=row.pick===row.actual;
    }
    k.histBound=true;
  }
}

function onSettle(item,room){
  if(!item||!room)return;
  for(const k of ST.list){
    if(k.room!==room)continue;
    const row=k.rows.find(x=>x.actual==null);if(!row)continue;
    row.period=item.period;row.actual=marketValue(k.market,item);row.sum=item.sum;row.hit=row.pick===row.actual;
  }
}

function planStats(k){const d=(k.rows||[]).filter(x=>x.actual!=null),h=d.filter(x=>x.hit).length;return {done:d.length,hits:h,rate:d.length?h/d.length:0}}
function pickNow(id,room){
  const k=ST.list.find(x=>x.id===id);if(!k)return {ok:false,reason:'missing'};
  if(room&&k.room!==room)return {ok:false,reason:'room',kol:k};
  const row=k.rows.find(x=>x.actual==null);
  if(!row)return {ok:false,reason:'done',kol:k};
  return {ok:true,pick:row.pick,kol:k,row};
}
function dotsHTML(k){const curIdx=k.rows.findIndex(x=>x.actual==null);return `<div class="dots">${k.rows.map((x,i)=>`<i class="${x.actual==null?(i===curIdx?'cur':''):(x.hit?'ok':'bad')}"></i>`).join('')}</div>`}

function handleHTML(k){return `<b class="khandle" data-noi18n>${esc(k.handle)}</b>${k.verified?vbadge():''}`}

function pageHTML(ctx){
  const room=ctx&&ctx.room,can=ctx&&ctx.canBet,tag=ST.demo?demoTag():'';
  if(!ST.active||!ST.list.length){
    return `<div class="page-h"><div><h1>Planes públicos</h1><p>Mira los planes de contraste públicos de perfiles verificados. Si sigues un plan, puedes usarlo en esta ronda confirmando tú la apuesta. Un plan no predice el sorteo.</p></div><button class="btn" data-go="mesa">Ir a la mesa</button></div>
      <div class="card"><div class="empty">Ahora mismo no hay planes públicos.</div></div>`;
  }
  const ids=follows();
  const shown=ST.tab==='siguiendo'?ST.list.filter(k=>ids.includes(k.id)):ST.list;
  const cards=shown.length?shown.map(k=>kolCard(k,room,can)).join(''):`<div class="card"><div class="empty">Aún no sigues ningún plan. Mira Destacados para elegir uno.</div></div>`;
  return `<div class="page-h"><div><h1>Planes públicos</h1><p>Mira los planes de contraste públicos de perfiles verificados. Si sigues un plan, puedes usarlo en esta ronda confirmando tú la apuesta. Un plan no predice el sorteo.</p></div><button class="btn" data-go="mesa">Ir a la mesa</button></div>
    <div class="fixedbox"><span class="ic">i</span><span>${FIXED}</span></div>
    <div class="soc-toolbar"><div class="seg" role="tablist" aria-label="Planes públicos">${['destacados','siguiendo'].map(t=>`<button data-act="socTab" data-arg="${t}" class="${ST.tab===t?'on':''}" role="tab">${t==='destacados'?'Destacados':'Siguiendo'}</button>`).join('')}</div>${tag}</div>
    <div class="soc-grid">${cards}</div>`;
}

function kolCard(k,room,can){
  const s=planStats(k),now=pickNow(k.id,room),on=isFollowed(k.id);
  const useOk=now.ok&&can;
  let useHint='';
  if(!now.ok&&now.reason==='room')useHint='Este plan es de otra sala.';
  else if(!now.ok&&now.reason==='done')useHint='Plan completo · '+pct(s.rate,0)+' de aciertos';
  else if(!can)useHint='Solo se puede usar mientras la apuesta está abierta. No se reserva ni se aplica sola en rondas siguientes.';
  return `<article class="card kcard" data-kol="${esc(k.id)}">
    <div class="card-h"><div><h2>${handleHTML(k)}</h2><p class="small mut">${roomLab(k.room)} · ${MARKETS[k.market].name} · ${fmtN(k.followers)} seguidores</p></div>
      <button class="btn sm ${on?'on-follow':''}" data-act="socFollow" data-arg="${esc(k.id)}" aria-label="${on?'Dejar de seguir':'Seguir'}">${on?'Siguiendo':'Seguir'}</button></div>
    ${k.simulated||ST.demo?demoTag():''}
    ${dotsHTML(k)}
    <div class="stats"><div class="stat"><small>Aciertos</small><b>${s.hits}</b></div><div class="stat"><small>Revisadas</small><b>${s.done}/${k.rows.length}</b></div><div class="stat"><small>Tasa de aciertos</small><b>${s.done?pct(s.rate,0):'—'}</b></div></div>
    <div class="small">${now.ok?'Plan público para esta ronda: <b>'+esc(now.pick)+'</b>':esc(useHint)}</div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri sm" data-act="socUse" data-arg="${esc(k.id)}" ${useOk?'':'disabled'}>Usar en esta ronda</button></div>
    <p class="fixed" style="margin-top:12px">${FIXED}</p>
  </article>`;
}

function planBarHTML(ctx){
  const room=ctx&&ctx.room,can=ctx&&ctx.canBet;
  const ids=follows();if(!ids.length||!ST.list.length)return '';
  return follows().map(id=>{
    const k=ST.list.find(x=>x.id===id);if(!k)return '';
    const s=planStats(k),now=pickNow(k.id,room);
    const useOk=now.ok&&can;
    let line;
    if(now.ok)line='Plan público para esta ronda: <b style="color:var(--ink)">'+esc(now.pick)+'</b>';
    else if(now.reason==='room')line='Este plan es de otra sala. · '+roomLab(k.room);
    else line='Plan completo · '+pct(s.rate,0)+' de aciertos';
    return `<div class="planrow kol"><div class="h"><b>${handleHTML(k)} · ${MARKETS[k.market].name}</b><span class="mut">${s.hits}/${s.done} aciertos</span></div>
      ${dotsHTML(k)}<div class="small mut">${line}</div>
      <div style="margin-top:8px"><button class="btn sm pri" data-act="socUse" data-arg="${esc(k.id)}" ${useOk?'':'disabled'}>Usar en esta ronda</button></div></div>`;
  }).join('');
}

function modalHTML(id,ctx){
  const room=ctx&&ctx.room,can=ctx&&ctx.canBet,bal=ctx&&ctx.balance,placed=ctx&&ctx.placed||{},staged=ctx&&ctx.staged||{};
  const now=pickNow(id,room),k=now.kol||ST.list.find(x=>x.id===id);
  if(!k)return '';
  if(!ST.modal||ST.modal.id!==id)ST.modal={id,amount:0,chip:null};
  const amt=ST.modal.amount;
  const cur=(placed[now.ok?now.pick:'']||0)+(staged[now.ok?now.pick:'']||0);
  const tot=Object.values(placed).reduce((a,b)=>a+b,0)+Object.values(staged).reduce((a,b)=>a+b,0);
  let reason='',ok=now.ok&&can;
  if(!now.ok){ok=false;reason=now.reason==='room'||now.reason==='done'?'Este plan no tiene una opción para esta ronda (otra sala o el plan ya terminó).':'Este plan no tiene una opción para esta ronda (otra sala o el plan ya terminó).'}
  else if(!can){ok=false;reason='Solo se puede usar mientras la apuesta está abierta. No se reserva ni se aplica sola en rondas siguientes.'}
  else if(amt+cur>2000){ok=false;reason='Máximo $2,000.00 por opción.'}
  else if(amt+tot>5000){ok=false;reason='Máximo $5,000.00 por ronda.'}
  else if(!(amt>=5)){ok=false}
  else if(amt>(bal||0)){ok=false;reason='Saldo de demostración insuficiente.'}
  const chips=CHIPS.map(v=>`<button class="chip ${ST.modal.chip===v?'on':''}" data-v="${v}" data-act="socChip" data-arg="${v}" aria-label="Ficha ${v} pesos">${v}</button>`).join('');
  const canUse=now.ok&&can;
  return `<div class="card-h"><div><h2>Usar este plan en esta ronda</h2><p class="small mut">${handleHTML(k)} · ${MARKETS[k.market].name} · ${roomLab(k.room)}${ST.demo?' '+demoTag():''}</p></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
    ${now.ok?`<p>Opción de esta ronda: <b>${esc(now.pick)}</b></p>`:`<p class="mut">${esc(reason)}</p>`}
    ${can?'':'<p class="note" style="margin:12px 0">Solo se puede usar mientras la apuesta está abierta. No se reserva ni se aplica sola en rondas siguientes.</p>'}
    <p class="note" style="margin:12px 0">Solo se usa en esta ronda. No se repetirá automáticamente.</p>
    <p class="fixed">Esto no es una predicción. La apuesta se confirma solo si tú lo decides.</p>
    <p class="fixed" style="margin-top:8px">${FIXED}</p>
    ${canUse?`<div class="lbl" style="margin-top:14px">Importe de esta ronda</div>
      <div class="chips" style="margin:8px 0 10px">${chips}</div>
      <div class="tot"><span>Importe de esta ronda</span><b>${money(amt)}</b></div>
      <div class="limits-mini"><span class="pill">Mín. $5.00</span><span class="pill">Máx. $2,000.00 por opción</span><span class="pill">Máx. $5,000.00 por ronda</span></div>
      ${reason&&!ok?`<p class="small" style="color:var(--bad);margin-top:8px">${esc(reason)}</p>`:''}
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn pri" data-act="socApply" data-arg="${esc(k.id)}" ${ok?'':'disabled'}>Confirmar</button><button class="btn" data-act="close">Cerrar</button><button class="btn ghost sm" data-act="socAmtClear">Limpiar</button></div>`
      :`<div style="margin-top:14px"><button class="btn" data-act="close">Cerrar</button></div>`}`;
}

function addChip(v,ctx){
  if(!ST.modal)return ST.modal;
  v=+v;if(!CHIPS.includes(v))return ST.modal;
  ST.modal.chip=v;
  const next=(ST.modal.amount||0)+v;
  const cap=Math.min(2000,ctx&&ctx.balance!=null?ctx.balance:2000);
  ST.modal.amount=Math.max(0,Math.min(cap,next));
  return ST.modal;
}
function clearAmt(ctx){if(!ST.modal)return;ST.modal.amount=0;ST.modal.chip=null}
function modalAmount(){return ST.modal?ST.modal.amount:0}
function closeModalState(){ST.modal=null}
function setTab(t){ST.tab=t==='siguiendo'?'siguiendo':'destacados'}

function tickerItems(period,room){
  if(!ST.active||!ST.list.length||!period)return [];
  const r=prng('r28-social-tick|'+period);
  const pool=ST.list.slice();
  const out=[];const n=1+Math.floor(r()*2);
  for(let i=0;i<n&&pool.length;i++){
    const ix=Math.floor(r()*pool.length),k=pool.splice(ix,1)[0];
    const opts=MARKETS[k.market].opts;
    const option=opts[Math.floor(r()*opts.length)];
    out.push({id:'soc-'+k.id+'-'+period,handle:k.handle,verified:!!k.verified,option,followers:k.followers,room:k.room});
  }
  return out;
}

function tickerHTML(period,room){
  const items=tickerItems(period,room);if(!items.length)return '';
  return items.map(t=>`<li class="kolt"><i></i><span>${t.verified?vbadge():''}<b class="khandle" data-noi18n>${esc(t.handle)}</b> acaba de tomar ${esc(t.option)} · ${fmtN(t.followers)} personas siguen este plan</span></li>`).join('');
}

g.R28Social={STORE,createDemoRoster,activate,bindHistory,onSettle,follows,isFollowed,toggleFollow,pickNow,planStats,
  pageHTML,planBarHTML,modalHTML,addChip,clearAmt,modalAmount,closeModalState,setTab,tickerItems,tickerHTML,handleHTML,
  marketValue,get list(){return ST.list},get tab(){return ST.tab},get active(){return ST.active},get demo(){return ST.demo},get state(){return ST},_prng:prng};
if(typeof module!=='undefined')module.exports=g.R28Social;
})(typeof globalThis!=='undefined'?globalThis:this);

</script>

/* Ronda 28 · motor i18n (ES-MX por defecto · 简体中文 · English). Sin red, sin dependencias.
 *
 * Cómo funciona
 * - Los diccionarios están en src/i18n-dict.js (R28_DICT.es / .zh / .en, mismas claves).
 * - El módulo sigue generando su HTML en español (idioma fuente). Este motor observa el DOM del módulo
 *   (shadow root) y, con un MutationObserver, sustituye cada texto/atributo visible por la traducción de
 *   su clave: es-texto → clave → texto en el idioma activo. Los marcadores {0},{1} capturan números,
 *   montos o nombres de opción (que a su vez se traducen). Así el juego (sorteo, pagos, tiempos, límites,
 *   estado) no cambia en absoluto: solo cambia el texto mostrado.
 * - Cambiar idioma NO re-inicia nada: no toca R28.state (ronda, saldo, apuestas, temporizadores).
 * - Prioridad del idioma: ?lang=xx en la URL (también en el hash, p. ej. #/ronda-28?lang=zh) > localStorage
 *   ("r28.lang") > "es".
 * - Montos: siempre MXN con formato $1,234.56 (no se usa formato de moneda del navegador).
 *   Los ids de ronda R28-… no se traducen. Horas: toLocaleTimeString(locale()) en la zona horaria del navegador.
 */
(function(){

            en:{label:'EN',locale:'en-US',html:'en',name:'English'}};
// Copias con otro idioma por defecto (p. ej. Ronda-28-zh.html) definen R28_I18N_DEFAULT y su propia clave de localStorage.
const STORE=globalThis.R28_I18N_STORE||'r28.lang';
const LETTER=/[A-Za-zÀ-ÖØ-öø-ÿ]/;

const ALLOW=[/^R28-[\w-]+$/,/^RC-[\w-]+$/,/^[0-9a-f]{12,}…?$/i,/\*\*\*/,/^\d+(\.\d+)?\s?(s|m|×|pts)$/,/^[AB]$/,/mod 10 =$/,/mxfox\.mx/,/^https?:/,/^\d{1,2}:\d{2}(:\d{2})?\s?(AM|PM|a\.\s?m\.|p\.\s?m\.)$/i,

  if(opts&&opts.scope)SCOPE=opts.scope;
  walk(root);
  const mo=new MutationObserver(ms=>{for(const m of ms){
    if(m.type==='childList')m.addedNodes.forEach(walk);
    else if(m.type==='characterData')doText(m.target);
    else doAttr(m.target,m.attributeName);
  }});
  mo.observe(root,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS});
  roots.push({root,mo});
  paintSwitchers(root);
}
function alive(r){const n=r.root;return n.nodeType===11?(n.host&&n.host.isConnected):n.isConnected!==false}
function paintSwitchers(root){
  (root.querySelectorAll?root.querySelectorAll('[data-lang]'):[]).forEach(b=>{const on=b.dataset.lang===lang;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
}
function switcherHTML(cls){
  return '<div class="'+(cls||'langsw')+'" role="group" aria-label="Idioma · 语言 · Language" data-noi18n>'+
    LANGS.map(l=>'<button type="button" data-lang="'+l+'" lang="'+META[l].html+'" title="'+META[l].name+'" class="'+(l===lang?'on':'')+'" aria-pressed="'+(l===lang)+'">'+META[l].label+'</button>').join('')+'</div>';
}
function urlLang(){
  try{let v=new URLSearchParams(location.search).get('lang');
    if(!v){const h=location.hash||'',i=h.indexOf('?');if(i>=0)v=new URLSearchParams(h.slice(i+1)).get('lang')}
    return normLang(v)}catch(e){return null}
}
function stored(){try{return normLang(localStorage.getItem(STORE))}catch(e){return null}}
function applyDocument(){
  try{document.documentElement.lang=META[lang].html;document.documentElement.dataset.r28Lang=lang}catch(e){}
  try{if(document.title){if(document.title!==document.__r28tt)document.__r28ts=document.title;
    const src=document.__r28ts,t2=lang==='es'?src:(translate(src,lang)||src);document.__r28tt=t2;if(document.title!==t2)document.title=t2}}catch(e){}
}
function set(l,opts){
  l=normLang(l);if(!l||!D[l])return false;
  const changed=l!==lang;lang=l;
  try{localStorage.setItem(STORE,l)}catch(e){}
  // si la URL trae ?lang=, se actualiza para que recargar mantenga la elección
  try{if(!(opts&&opts.keepUrl)&&urlLang()&&urlLang()!==l){
    const u=new URL(location.href);
    if(u.searchParams.has('lang'))u.searchParams.set('lang',l);
    else if(u.hash.indexOf('?')>=0){const [h,q]=u.hash.split('?');const p=new URLSearchParams(q);p.set('lang',l);u.hash=h+'?'+p}
    history.replaceState(history.state,'',u.href);
  }}catch(e){}
  for(let i=roots.length-1;i>=0;i--){const r=roots[i];if(!alive(r)){r.mo.disconnect();roots.splice(i,1);continue}walk(r.root);paintSwitchers(r.root)}
  applyDocument();
  if(changed)try{globalThis.dispatchEvent(new CustomEvent('r28:lang',{detail:{lang:l}}))}catch(e){}
  return true;
}
function t(key,...args){const T=D[lang]||{};const v=T[key]!=null&&T[key]!==''?T[key]:(D.es[key]!=null?D.es[key]:key);return fill(v,args)}

lang=urlLang()||stored()||normLang(globalThis.R28_I18N_DEFAULT)||'es';
if(urlLang())try{localStorage.setItem(STORE,lang)}catch(e){}
globalThis.R28I18N={LANGS,META,dict:D,get lang(){return lang},set,t,locale:()=>META[lang].locale,attach,translate,allowed,misses,switcherHTML,
  refresh(){for(const r of roots)if(alive(r))walk(r.root);applyDocument()}};
// SPA con rutas en el hash (MXFox): #/ruta?lang=xx también cambia el idioma sin recargar
try{globalThis.addEventListener('hashchange',()=>{const u=urlLang();if(u&&u!==lang)set(u,{keepUrl:true})})}catch(e){}
if(document.readyState!=='loading')applyDocument();else document.addEventListener('DOMContentLoaded',applyDocument);
})();

</script>
<script>
(function(){
'use strict';
const D=globalThis.Draw;
const CHIPS=[5,10,20,50,100],MIN_BET=5,MAX_OPT=2000,MAX_ROUND=5000;
const FIXED='Los resultados anteriores no determinan los siguientes. Un plan solo te ayuda a contrastar, no predice el sorteo.';
const TIMING={demo:{open:20,lock:5,reveal:5},'1m':{open:55,lock:5,reveal:5},'3m':{open:175,lock:5,reveal:5}};
const PREP_MS=1200,HIST_KEEP=200,PRESEED=36,REMIND_MS=60*60*1000;
const ALL_PAGES=[['inicio','Inicio'],['mesa','Mesa'],['plan','Mi plan'],['publicos','Planes públicos'],['apuestas','Mis apuestas'],['pagos','Tabla de pagos'],['como','Cómo se juega'],['limites','Límites'],['cartera','Cartera']];
const COUNTS=(()=>{const c=new Array(28).fill(0);for(let a=0;a<10;a++)for(let b=0;b<10;b++)for(let d=0;d<10;d++)c[a+b+d]++;return c})();
const MAIN=[['Chico','Suma 0–13','k-chico',500],['Grande','Suma 14–27','k-grande',500],['Par','Suma par','k-par',500],['Impar','Suma impar','k-impar',500]];
const COMBO=[['Chico impar','1, 3, 5 … 13','k-ci',269],['Chico par','0, 2, 4 … 12','k-cp',231],['Grande impar','15, 17 … 27','k-gi',231],['Grande par','14, 16 … 26','k-gp',269]];
const EXT=[['Extremo chico','Suma 0–5','k-chico',56],['Trío','Tres iguales: 000 … 999','k-trio',10],['Extremo grande','Suma 22–27','k-grande',56]];
const KCLASS={};[...MAIN,...COMBO,...EXT].forEach(x=>KCLASS[x[0]]=x[2]);
for(let i=0;i<28;i++)KCLASS['Suma '+i]=i<14?'k-chico':'k-grande';
const MARKETS={size:{name:'Grande / Chico',opts:['Grande','Chico']},parity:{name:'Par / Impar',opts:['Par','Impar']},combo:{name:'Combinación',opts:['Chico impar','Chico par','Grande impar','Grande par']}};

/* ---------- configuración ----------
 * window.R28_CONFIG (o R28.init(opts)):
 *   shell:      'standalone' (página propia con lobby) | 'mxfox' (embebido en el sitio MXFox)
 *   betsFeed:   adaptador de feed real de apuestas (ver heat.js). Prioridad sobre el simulador.
 *   demoHeat:   true => usa el simulador determinista SOLO como demo (etiquetado "Datos de ejemplo (demo)").
 *               Si no hay betsFeed y demoHeat no es true, los módulos de actividad NO se muestran.
 *   kolFeed:    adaptador de planes públicos (ver social.js). Prioridad sobre el roster demo.
 *   demoSocial: true => usa el roster demo de social.js (también etiquetado "Datos de ejemplo (demo)").
 *               Si no hay kolFeed y demoSocial no es true, Planes públicos explica que no hay planes.
 *   exitHref:   a dónde lleva "Terminar sesión" en modo embebido.
 *   testSeedPrefix: SOLO pruebas automáticas; fija las semillas (sha256(prefijo:n)) para comparar corridas.
 */
const CFG=Object.assign({shell:'standalone',betsFeed:null,demoHeat:false,kolFeed:null,demoSocial:false,exitHref:'#/home',testSeedPrefix:null},globalThis.R28_CONFIG||{});
let FEED=null;
const PAGES=()=>CFG.shell==='mxfox'?ALL_PAGES.filter(p=>p[0]!=='inicio'):ALL_PAGES;
const S={page:'inicio',balance:1000,chip:10,room:'1m',real:false,staged:{},placed:{},phase:'prep',phaseStart:0,phaseEnd:0,
  round:null,roundSeq:0,result:null,reveal:0,busy:false,hist:{'1m':[],'3m':[]},tickets:[],ledger:[],plans:[],
  reminders:true,paused:false,sessionStart:Date.now(),lastRemind:Date.now(),boardTab:'main',editor:null,lastSummary:null,ready:false};

/* ---------- utils ---------- */
let ROOT=null,WRAP=null;
const $=s=>ROOT?ROOT.querySelector(s):null;
const $$=s=>ROOT?Array.from(ROOT.querySelectorAll(s)):[];
const I18N=globalThis.R28I18N||null;   // i18n opcional (src/i18n.js); sin él todo queda en español
const LOCALE=()=>I18N?I18N.locale():'es-MX';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){const neg=n<0;const [i,d]=Math.abs(n).toFixed(2).split('.');return (neg?'-':'')+'$'+i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+d}
const mx=o=>D.odds[o].toFixed(2);
const pct=(n,d=1)=>(n*100).toFixed(d)+'%';
const sumOf=o=>Object.values(o).reduce((a,b)=>a+b,0);
const cfg=()=>S.real?TIMING[S.room]:TIMING.demo;
const hist=()=>S.hist[S.room];
let seedN=0;
async function newSeed(){if(CFG.testSeedPrefix)return D.hash(CFG.testSeedPrefix+':'+(++seedN));const b=new Uint8Array(32);globalThis.crypto.getRandomValues(b);return Array.from(b,v=>v.toString(16).padStart(2,'0')).join('')}
function periodId(d,room){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);
  const g=t=>p.find(x=>x.type===t).value;
  return 'R28-'+g('year')+g('month')+g('day')+'-'+g('hour')+g('minute')+g('second')+'-'+room;
}
const shortPid=pid=>{const t=pid.split('-')[2]||'';return t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4,6)};
const sizeCls=sum=>sum>=14?'g':'c';
const isTrio=b=>b[0]===b[1]&&b[1]===b[2];
function toast(msg,kind){if(!ROOT)return;const e=document.createElement('div');e.className='toast '+(kind||'');e.textContent=msg;$('#toasts').append(e);setTimeout(()=>e.remove(),2600)}
const ballsHTML=b=>'<span class="bb">'+b.map(v=>'<i>'+v+'</i>').join('')+'</span>';
function marketValue(m,r){return m==='size'?r.size:m==='parity'?r.parity:r.combination}

/* ---------- rounds ---------- */
async function seedHistory(room){
  const c=cfg(),cyc=(c.open+c.lock+c.reveal)*1000+PREP_MS,now=Date.now(),arr=[];
  for(let k=PRESEED;k>=1;k--){
    const seed=await newSeed(),period=periodId(new Date(now-k*cyc),room),commit=await D.hash(seed),r=await D.draw(seed,period);
    arr.unshift({...r,period,seed,commit,trio:isTrio(r.balls),preseed:true});
  }
  S.hist[room]=arr;
}
async function newRound(){
  S.phase='prep';S.result=null;S.reveal=0;S.staged={};S.placed={};S.lastSummary=null;S.roundSeq++;
  const seed=await newSeed(),commit=await D.hash(seed);
  S.round={seed,commit,period:periodId(new Date(),S.room),room:S.room};
  S.phaseStart=Date.now();S.phaseEnd=S.phaseStart+PREP_MS;
  render();
}
async function advance(){
  if(S.busy)return;S.busy=true;
  const now=Date.now(),c=cfg();
  try{
    if(S.phase==='prep'){S.phase='open';S.phaseStart=now;S.phaseEnd=now+c.open*1000;heatStart();render()}
    else if(S.phase==='open'){
      const n=Object.keys(S.staged).length;S.staged={};
      S.phase='lock';S.phaseStart=now;S.phaseEnd=now+c.lock*1000;heatLock();
      if(n)toast('Bloqueo: las selecciones sin confirmar se descartaron.','warn');
      render();
      if(globalThis.R28Social&&R28Social.state.modal&&!$('#modal').hidden)refreshSocialModal(R28Social.state.modal.id);
    }else if(S.phase==='lock'){
      // El resultado se calcula SOLO después del Bloqueo.
      S.result=await D.draw(S.round.seed,S.round.period);
      S.result.trio=isTrio(S.result.balls);
      S.phase='draw';S.phaseStart=now;S.phaseEnd=now+c.reveal*1000;S.reveal=0;render();
      [450,1150,1850].forEach((t,i)=>setTimeout(()=>{S.reveal=i+1;paintStage()},t));
      setTimeout(()=>{S.reveal=4;paintStage()},2500);
      setTimeout(()=>{settle()},3150);
    }else{await newRound()}
  }finally{S.busy=false}
}
function settle(){
  const r=S.result,room=S.room;
  const item={...r,period:S.round.period,seed:S.round.seed,commit:S.round.commit};
  S.hist[room].unshift(item);if(S.hist[room].length>HIST_KEEP)S.hist[room].length=HIST_KEEP;
  let stake=0,pay=0;
  for(const [o,s] of Object.entries(S.placed)){
    const p=D.settle(o,s,r);stake+=s;pay+=p;
    S.tickets.unshift({period:item.period,balls:r.balls,sum:r.sum,o,s,pay:p});
  }
  if(pay>0){S.balance=Math.round((S.balance+pay)*100)/100;S.ledger.unshift({t:Date.now(),c:'Pago de ronda',p:item.period,a:pay,b:S.balance})}
  S.lastSummary=stake?{stake,pay}:null;
  for(const p of S.plans){
    if(S.roundSeq<p.from)continue;
    const row=p.rows.find(x=>x.actual==null);if(!row)continue;
    row.period=item.period;row.actual=marketValue(p.market,r);row.sum=r.sum;row.hit=row.pick===row.actual;
  }
  if(globalThis.R28Social)R28Social.onSettle(item,room);
  heatSummarize(r);
  S.phase='pay';S.reveal=5;render();
  if(pay>0){const st=$('.stage');if(st){st.classList.remove('won');void st.offsetWidth;st.classList.add('won')}bumpWallet();toast('Retorno de la ronda: '+money(pay),'ok')}
}
function tick(){
  if(!S.ready)return;
  if(ROOT&&!ROOT.host.isConnected)ROOT=null;
  const now=Date.now();
  if(now>=S.phaseEnd&&!S.busy&&(S.phase!=='draw'||S.reveal>=5))advance();
  updateClock();updateExternal();
  if(H.dirty)paintHeat();
  if(S.reminders&&now-S.lastRemind>=REMIND_MS){S.lastRemind=now;showReminder()}
}
let rollN=0;
setInterval(()=>{if(S.phase!=='draw')return;rollN++;$$('.ball.rolling .num').forEach((e,i)=>{e.textContent=(rollN*7+i*3)%10})},70);

/* ---------- betting ---------- */
const canBet=()=>S.phase==='open'&&!S.paused;
function addStake(o){
  if(S.paused){toast('La mesa está en pausa. Puedes volver desde Límites.','warn');return}
  if(!canBet()){toast(S.phase==='lock'?'Bloqueado: la ronda ya no acepta apuestas.':'Espera a que abra la siguiente ronda.','warn');return}
  const c=S.chip,cur=(S.staged[o]||0)+(S.placed[o]||0),tot=sumOf(S.staged)+sumOf(S.placed);
  if(c<MIN_BET)return;
  if(cur+c>MAX_OPT){toast('Máximo '+money(MAX_OPT)+' por opción.','warn');return}
  if(tot+c>MAX_ROUND){toast('Máximo '+money(MAX_ROUND)+' por ronda.','warn');return}
  if(sumOf(S.staged)+c>S.balance){toast('Saldo de demostración insuficiente.','warn');return}
  S.staged[o]=(S.staged[o]||0)+c;renderMesaParts();
}
function placeAll(){
  if(!canBet())return;const t=sumOf(S.staged);if(!t)return;
  if(t>S.balance){toast('Saldo de demostración insuficiente.','warn');return}
  for(const [o,s] of Object.entries(S.staged)){S.placed[o]=(S.placed[o]||0)+s}
  S.balance=Math.round((S.balance-t)*100)/100;
  S.ledger.unshift({t:Date.now(),c:'Apuesta ('+Object.keys(S.staged).join(', ')+')',p:S.round.period,a:-t,b:S.balance});
  S.staged={};bumpWallet();toast('Apuesta confirmada · '+money(t),'ok');renderMesaParts();
}
function cancelPlaced(){
  if(!canBet())return;const t=sumOf(S.placed);if(!t)return;
  S.balance=Math.round((S.balance+t)*100)/100;S.placed={};
  S.ledger.unshift({t:Date.now(),c:'Cancelación antes del Bloqueo',p:S.round.period,a:t,b:S.balance});
  toast('Apuestas canceladas · '+money(t)+' devuelto');renderMesaParts();
}
function placeDirect(o,amount){
  if(S.paused){toast('La mesa está en pausa. Puedes volver desde Límites.','warn');return false}
  if(!canBet()){toast(S.phase==='lock'?'Bloqueado: la ronda ya no acepta apuestas.':'Espera a que abra la siguiente ronda.','warn');return false}
  const a=Math.round(Number(amount)*100)/100;
  if(!(a>=MIN_BET))return false;
  const cur=(S.staged[o]||0)+(S.placed[o]||0),tot=sumOf(S.staged)+sumOf(S.placed);
  if(cur+a>MAX_OPT){toast('Máximo '+money(MAX_OPT)+' por opción.','warn');return false}
  if(tot+a>MAX_ROUND){toast('Máximo '+money(MAX_ROUND)+' por ronda.','warn');return false}
  if(a>S.balance){toast('Saldo de demostración insuficiente.','warn');return false}
  S.placed[o]=(S.placed[o]||0)+a;
  S.balance=Math.round((S.balance-a)*100)/100;
  S.ledger.unshift({t:Date.now(),c:'Apuesta ('+o+')',p:S.round.period,a:-a,b:S.balance});
  bumpWallet();toast('Apuesta confirmada · '+money(a),'ok');renderMesaParts();
  return true;
}
function bumpWallet(){const w=$('.wallet');if(!w)return;w.classList.remove('bump');void w.offsetWidth;w.classList.add('bump');$('#bal').textContent=money(S.balance)}
async function switchRoom(room,real){
  if(sumOf(S.placed)||sumOf(S.staged)){toast('Cancela o espera tus apuestas para cambiar de sala.','warn');render();return}
  if(S.phase==='draw'||S.phase==='lock'){toast('Espera a que termine el sorteo para cambiar.','warn');render();return}
  S.room=room;S.real=real;
  if(!S.hist[room].length)await seedHistory(room);
  if(globalThis.R28Social)R28Social.bindHistory(S.hist);
  await newRound();
}

/* ---------- stats ---------- */
function omis(pred){const h=hist();const i=h.findIndex(pred);return i<0?'≥'+h.length:String(i)}
function streak(key){const h=hist();if(!h.length)return null;const v=h[0][key];let n=0;while(n<h.length&&h[n][key]===v)n++;return {v,n}}
function bigRoad(vals){const cols=[];let prev=null;for(const v of vals){if(v===prev&&cols[cols.length-1].length<6)cols[cols.length-1].push(v);else cols.push([v]);prev=v}return cols}

/* ---------- render: shell ---------- */
function renderNav(){
  if(!$('#nav'))return;
  $('#nav').innerHTML=PAGES().map(([k,l])=>'<a href="#" data-go="'+k+'" class="'+(S.page===k?'on':'')+'">'+l+'</a>').join('');
  const on=$('#nav a.on');if(on&&on.scrollIntoView){const n=$('#nav');n.scrollLeft=Math.max(0,on.offsetLeft-n.clientWidth/2+on.clientWidth/2)}
}
function render(){
  if(!ROOT||!ROOT.host.isConnected){ROOT=null;return}
  WRAP.dataset.page=S.page;WRAP.dataset.phase=S.phase;
  $('#bal').textContent=money(S.balance);renderNav();
  const f={inicio:pInicio,mesa:pMesa,plan:pPlan,publicos:pPublicos,apuestas:pApuestas,pagos:pPagos,como:pComo,limites:pLimites,cartera:pCartera}[S.page];
  const keep=window.scrollY;$('#app').innerHTML=f();
  if(S.page==='mesa'){renderBetbar();scrollRoads();H.dirty=true;paintHeat()}else $('#betbar').hidden=true;
  window.scrollTo(0,keep);updateClock();
}
function go(p){if(p==='inicio'&&CFG.shell==='mxfox'){location.hash=CFG.exitHref;return}S.page=p;render();window.scrollTo(0,0)}
function renderMesaParts(){
  if(!ROOT)return;
  if(S.page!=='mesa'){render();return}
  const b=$('#boardBody');if(b)b.innerHTML=boardBody();
  const s=$('#slip');if(s)s.innerHTML=slipBody();
  renderBetbar();$('#bal').textContent=money(S.balance);H.dirty=true;paintHeat();
}

/* ---------- clock ---------- */
function phaseLabel(){return {prep:'Nuevo compromiso',open:'Apuesta abierta',lock:'Bloqueo',draw:'Sorteo',pay:'Pago'}[S.phase]}
function updateClock(){
  if(!ROOT)return;
  WRAP.dataset.phase=S.phase;
  const now=Date.now(),left=Math.max(0,Math.ceil((S.phaseEnd-now)/1000)),c=cfg();
  const lab={prep:'Publicando compromiso…',open:'para el Bloqueo',lock:'para el sorteo',draw:'revelando resultado',pay:'siguiente ronda en'}[S.phase];
  $$('[data-clk]').forEach(e=>e.innerHTML=left+'<small>s</small>');
  $$('[data-clklab]').forEach(e=>e.textContent=lab);
  $$('[data-ph]').forEach(e=>e.textContent=phaseLabel());
  const tl=$('#tl');
  if(tl){const fr=(a,b)=>Math.min(1,Math.max(0,(now-a)/(b-a)));
    const p={o:0,l:0,d:0};
    if(S.phase==='open')p.o=fr(S.phaseStart,S.phaseEnd);
    else if(S.phase==='lock'){p.o=1;p.l=fr(S.phaseStart,S.phaseEnd)}
    else if(S.phase==='draw'||S.phase==='pay'){p.o=1;p.l=1;p.d=S.phase==='pay'?Math.max(.65,fr(S.phaseStart,S.phaseEnd)):fr(S.phaseStart,S.phaseEnd)}
    tl.querySelector('.o i').style.setProperty('--p',p.o);tl.querySelector('.l i').style.setProperty('--p',p.l);tl.querySelector('.d i').style.setProperty('--p',p.d);
    $$('.tl-lab span').forEach(e=>e.classList.toggle('on',e.dataset.k===({prep:'o',open:'o',lock:'l',draw:'d',pay:'d'})[S.phase]));
    tl.querySelector('.o').style.flex=c.open;tl.querySelector('.l').style.flex=c.lock;tl.querySelector('.d').style.flex=c.reveal;
  }
  const bb=$('#bbPh');if(bb)bb.textContent=phaseLabel()+' · '+left+'s';
}

/* ---------- pages ---------- */
function pInicio(){
  const h=hist(),last=h[0];
  const lastBalls=last?last.balls:[0,0,0];
  return `<section class="lobby-h"><small>Casino · Juegos instantáneos</small><h1>Rondas rápidas, reglas claras</h1><p class="mut">Juegos de ronda corta con resultado verificable. Todo con saldo de demostración.</p></section>
  <div class="games">
    ${gameCard('av','Aviator','Multiplicador en vuelo. Retira antes de que despegue.',svgAviator())}
    ${gameCard('rc','Ronda Color','Ronda corta de colores. Disponible en otra mesa.',svgColor())}
    <article class="game live"><div class="art r28"><span class="pill g live-tag"><span data-ph>${phaseLabel()}</span> · <span data-clk></span></span>

  return `<div class="card pcard"><div class="card-h"><div><h2>${esc(p.name)} · ${MARKETS[p.market].name}</h2><p class="small mut">Sala ${p.room} · ${p.rows.length} rondas</p></div><div style="display:flex;gap:6px"><button class="btn sm" data-act="editPlan" data-arg="${p.id}" ${curIdx<0?'disabled':''}>Editar pendientes</button><button class="btn sm ghost" data-act="delPlan" data-arg="${p.id}">Eliminar plan</button></div></div>

let planId=0;
function confirmPlan(){
  const e=S.editor;if(!e)return;const picks=e.picks.slice(0,e.n);if(!picks.every(Boolean))return;
  const from=(S.phase==='open'||S.phase==='prep')?S.roundSeq:S.roundSeq+1;
  if(e.id!=null){const p=S.plans.find(x=>x.id===e.id);p.rows.forEach((r,i)=>{if(r.actual==null)r.pick=picks[i]});p.from=Math.max(p.from,from);toast('Plan actualizado','ok')}
  else{if(S.plans.length>=2){toast('Máximo 2 planes.','warn');return}
    const name=S.plans.some(p=>p.name==='Plan A')?'Plan B':'Plan A';
    S.plans.push({id:++planId,name,market:e.market,room:S.room,from,rows:picks.map(pk=>({pick:pk,period:null,actual:null,sum:null,hit:null}))});toast(name+' confirmado','ok')}
  S.editor=S.plans.length<2?defaultEditor():null;render();
}

async function verifyModal(item,manual){
  const seed=item?item.seed:'demo-fixed-seed',period=item?item.period:'R28-20261112-120001-1m';
  openModal(`<div class="card-h"><div><h2>Verificar ronda</h2><p class="small mut">Cálculo hecho en tu navegador con la misma función del sorteo.</p></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
   <div class="field"><label for="vSeed">Semilla (server_seed)</label><input id="vSeed" value="${esc(seed)}" spellcheck="false"></div>

async function runVerify(){
  const seed=$('#vSeed').value,pid=$('#vPid').value.trim(),want=$('#modal').dataset.commit||'';
  const c=await D.hash(seed),r=await D.draw(seed,pid),ok=c===want;
  $('#vOut').innerHTML=`<div class="vs ${ok?'okb':''}"><small>1 · SHA-256(semilla)</small><span class="mono">${c}</span><div style="margin-top:6px">${want?(ok?'<span class="pill ok">Coincide con el compromiso publicado</span>':'<span class="pill bad">No coincide con el compromiso guardado</span>'):''}</div></div>
  <div class="vs"><small>2 · h = HMAC-SHA256(semilla, ronda)</small><span class="mono">${r.h}</span></div>
  <div class="vs"><small>3 · N = h como entero · tres números</small><div class="mono">n0 = N mod 10 = <b>${r.balls[0]}</b> · n1 = ⌊N/10⌋ mod 10 = <b>${r.balls[1]}</b> · n2 = ⌊N/100⌋ mod 10 = <b>${r.balls[2]}</b></div></div>
  <div class="vs okb"><small>4 · Resultado</small><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${ballsHTML(r.balls)}<b style="font-size:20px">= ${r.sum}</b><span class="pill ${sizeCls(r.sum)}">${r.size}</span><span class="pill ${r.parity==='Par'?'p':'i'}">${r.parity}</span><span class="pill">${r.combination}</span></div></div>`;
}

  el.innerHTML=`<div class="in"><span>Llevas ${mins} minutos en esta sesión. Tómate una pausa si lo necesitas.</span><span style="display:flex;gap:8px"><button class="btn sm" data-go="limites">Límites</button><button class="btn sm pri" data-act="dismissRemind">Cerrar</button></span></div>`;el.hidden=false;
}

/* ---------- events ---------- */
async function onClick(ev){
  const lg=ev.target.closest('[data-lang]');if(lg){ev.preventDefault();if(I18N)I18N.set(lg.dataset.lang);return}
  const g=ev.target.closest('[data-go]');if(g){ev.preventDefault();closeModal();go(g.dataset.go);return}
  const o=ev.target.closest('[data-o]');if(o&&!o.disabled){addStake(o.dataset.o);return}
  const a=ev.target.closest('[data-act]');if(!a||a.disabled)return;
  const act=a.dataset.act,arg=a.dataset.arg;
  if(act==='chip'){S.chip=+arg;renderMesaParts();const bh=$('.board-h .chips');if(bh)bh.innerHTML=chipsHTML();const sm=$('.board-h p b');if(sm)sm.textContent=money(S.chip)}
  else if(act==='place')placeAll();
  else if(act==='clear'){S.staged={};renderMesaParts()}
  else if(act==='cancel')cancelPlaced();
  else if(act==='tab'){S.boardTab=arg;$('.board').dataset.tab=arg;$$('.btabs button').forEach(b=>b.classList.toggle('on',b.dataset.arg===arg))}
  else if(act==='room'){if(arg!==S.room)await switchRoom(arg,S.real)}
  else if(act==='history')historyModal();
  else if(act==='verify'){const it=hist()[+arg];if(it)verifyModal(it)}
  else if(act==='verifyManual')verifyModal(null,true);
  else if(act==='vRun')runVerify();
  else if(act==='vFixed'){$('#vSeed').value='demo-fixed-seed';$('#vPid').value='R28-20261112-120001-1m';$('#modal').dataset.commit='30ae56792bf719302927ae358aeb9cdd591eb1dff12fd35ae9c0b2b684d13a93';runVerify()}
  else if(act==='close')closeModal();
  else if(act==='market'){S.editor.market=arg;S.editor.picks=new Array(10).fill('');render()}
  else if(act==='n'){S.editor.n=Math.min(10,Math.max(1,S.editor.n+(+arg)));render()}
  else if(act==='tpl'){applyTemplate(arg);render()}
  else if(act==='pick'){const [i,v]=arg.split('|');S.editor.picks[+i]=v;render()}
  else if(act==='confirmPlan')confirmPlan();
  else if(act==='clearPlan'){S.editor.picks=new Array(10).fill('');render()}
  else if(act==='cancelEdit'){S.editor=S.plans.length<2?defaultEditor():null;render()}
  else if(act==='editPlan'){const p=S.plans.find(x=>x.id===+arg);S.editor={id:p.id,market:p.market,n:p.rows.length,picks:p.rows.map(r=>r.pick)};render();window.scrollTo(0,0)}
  else if(act==='delPlan'){S.plans=S.plans.filter(x=>x.id!==+arg);if(S.editor&&S.editor.id===+arg)S.editor=null;if(!S.editor)S.editor=defaultEditor();render()}
  else if(act==='pause'){S.paused=true;S.staged={};toast('Saliste de la mesa. Puedes volver cuando quieras.');render()}
  else if(act==='resume'){S.paused=false;toast('Volviste a la mesa.');render()}
  else if(act==='exit'){S.paused=true;S.staged={};toast('Sesión terminada. Gracias por jugar.');if(CFG.shell==='mxfox')location.hash=CFG.exitHref;else go('inicio')}
  else if(act==='dismissRemind'){$('#reminder').hidden=true}
  else if(act==='socFollow'){if(!globalThis.R28Social)return;const on=R28Social.isFollowed(arg);R28Social.toggleFollow(arg);toast(on?'Ya no sigues este plan.':'Empezaste a seguir este plan.','ok');render()}
  else if(act==='socTab'){if(!globalThis.R28Social)return;R28Social.setTab(arg);render()}
  else if(act==='socUse')openSocialUse(arg)
  else if(act==='socChip'){if(!globalThis.R28Social||!R28Social.state.modal)return;R28Social.addChip(arg,socialCtx());refreshSocialModal(R28Social.state.modal.id)}
  else if(act==='socAmtClear'){if(!globalThis.R28Social||!R28Social.state.modal)return;R28Social.clearAmt(socialCtx());refreshSocialModal(R28Social.state.modal.id)}
  else if(act==='socApply')applySocialUse(arg)
}
function socialCtx(){return {room:S.room,canBet:canBet(),balance:S.balance,chip:S.chip,placed:S.placed,staged:S.staged}}
function openSocialUse(id){
  if(!globalThis.R28Social)return;
  R28Social.closeModalState();
  openModal(R28Social.modalHTML(id,socialCtx()));
}
function refreshSocialModal(id){
  const m=$('#modal');if(!m||m.hidden)return;
  openModal(R28Social.modalHTML(id,socialCtx()));
}
function applySocialUse(id){
  if(!globalThis.R28Social)return;
  const now=R28Social.pickNow(id,S.room);const amt=R28Social.modalAmount();
  if(!now.ok||!canBet()){refreshSocialModal(id);return}
  closeModal();R28Social.closeModalState();
  placeDirect(now.pick,amt);
}
async function onChange(ev){
  const a=ev.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='real')await switchRoom(S.room,a.checked);
  if(a.dataset.act==='remind'){S.reminders=a.checked;S.lastRemind=Date.now()}
}
function onKey(ev){if(ev.key==='Escape')closeModal();const t=ev.composedPath?ev.composedPath()[0]:ev.target;if(ev.key==='Enter'&&t&&t.classList&&t.classList.contains('wallet'))go('cartera')}
function scrollRoads(){$$('.road-sc').forEach(e=>e.scrollLeft=e.scrollWidth)}


/* ---------- capa de actividad (heat) ----------
 * Estado separado (H). Nunca lee ni escribe S.balance, S.placed, S.tickets, la semilla ni el sorteo.
 * El feed recibe solo {period, room, openAt, lockAt} (congelado). El resumen usa el resultado ya publicado.
 */
const H={seq:0,period:null,unsub:null,per:{},bets:[],ticker:[],summary:null,server:null,locked:false,dirty:false};
const demoTag=()=>'<span class="demo-tag">Datos de ejemplo (demo)</span>';
const svgUser=()=>'<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5" fill="currentColor"/></svg>';
function heatStop(){if(H.unsub){try{H.unsub()}catch(e){}H.unsub=null}}
function heatStart(){
  if(!FEED)return;heatStop();
  Object.assign(H,{period:S.round.period,per:{},bets:[],ticker:[],summary:null,server:null,locked:false,dirty:true});
  const round=Object.freeze({period:S.round.period,room:S.room,openAt:S.phaseStart,lockAt:S.phaseEnd});
  try{const u=FEED.subscribe(round,heatEvent);H.unsub=typeof u==='function'?u:null}catch(e){console.warn('R28 feed',e)}
}
function heatLock(){if(!FEED)return;H.locked=true;heatStop();H.dirty=true}
function heatEvent(ev){
  if(!ev||ev.period!==H.period)return;
  if(ev.type==='bet'){
    if(H.locked)return;                                   // tras el Bloqueo no se aceptan eventos de apuesta
    if(!Object.prototype.hasOwnProperty.call(D.odds,ev.option))return;
    const a=Math.round(Number(ev.amount)*100)/100;if(!(a>0)||a>MAX_OPT)return;
    const u=String(ev.user||'***').slice(0,14);
    const p=H.per[ev.option]||(H.per[ev.option]={users:new Set(),amount:0});
    p.users.add(u);p.amount=Math.round((p.amount+a)*100)/100;
    H.bets.push({user:u,option:ev.option,amount:a});
    H.ticker.unshift({id:++H.seq,k:'bet',user:u,option:ev.option,amount:a});if(H.ticker.length>24)H.ticker.length=24;
    H.dirty=true;
  }else if(ev.type==='summary'){
    H.server={winners:+ev.winners||0,paid:+ev.paid||0,bigWins:Array.isArray(ev.bigWins)?ev.bigWins.slice(0,3):[],bets:H.bets.length};
    if(S.phase==='pay'){H.summary=H.server;render()}
  }
}
function heatSummarize(result){
  if(!FEED)return;
  // Copia congelada del resultado publicado: el resumen no puede alterarlo.
  const r=Object.freeze({...result,balls:Object.freeze(result.balls.slice())});
  H.summary=H.server||globalThis.R28Heat.summarize(H.bets.slice(),r,D);
  for(const w of H.summary.bigWins.slice().reverse())H.ticker.unshift({id:++H.seq,k:'big',user:w.user,option:w.option,amount:w.payout});
  H.dirty=true;
}
function heatBarsHTML(){
  const bar=(a,b,ka,kb)=>`<div class="hbar" data-bar="${a}|${b}"><div class="hb-l"><span class="${ka}"><b>${a}</b> <em data-hb="a"></em></span><span class="${kb}"><em data-hb="b"></em> <b>${b}</b></span></div><div class="hb-t"><i class="hb-a ${ka}"></i><i class="hb-b ${kb}"></i></div></div>`;
  return `<div class="hbars"><div class="hb-h"><span>Reparto de apuestas de otros jugadores</span>${FEED.simulated?demoTag():''}</div>${bar('Chico','Grande','k-chico','k-grande')}${bar('Par','Impar','k-par','k-impar')}<p class="hb-n">Solo informativo: lo que apuestan otros no cambia las probabilidades ni los pagos.</p></div>`;
}
function tickerCardHTML(){
  return `<div class="card tick"><div class="card-h"><h2>Actividad de la mesa</h2>${FEED.simulated?demoTag():'<span class="pill">En vivo</span>'}</div>
    <div class="tk-stats"><span><b data-hk="users">0</b> jugadores</span><span><b data-hk="bets">0</b> apuestas</span><span><b data-hk="amount">$0.00</b></span></div>
    <ul class="tk" id="ticker"></ul><p class="small mut" style="margin-top:8px">Nombres enmascarados. Información de la ronda en curso, no es una recomendación.</p></div>`;
}
function roundSummaryHTML(){
  const s=H.summary;
  return `<div class="rsum"><div class="rs-h"><b>Resumen de la ronda</b>${FEED.simulated?demoTag():''}</div>
    <div class="rs-k"><span><small>Ganadores</small><b>${s.winners}</b></span><span><small>Pagado en total</small><b>${money(s.paid)}</b></span><span><small>Apuestas</small><b>${s.bets}</b></span></div>
    ${s.bigWins.length?`<div class="rs-big">${s.bigWins.map(w=>`<div class="bigw">${svgTrophy()}<span><b>${esc(w.user)}</b> ganó <b>${money(w.payout)}</b> con ${esc(w.option)}</span></div>`).join('')}</div>`:''}</div>`;
}
const svgTrophy=()=>'<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8v3a4 4 0 0 1-8 0zM2 3h2v2a2 2 0 0 1-2-2zm10 0h2a2 2 0 0 1-2 2zM7 9h2v3h2v2H5v-2h2z" fill="currentColor"/></svg>';
function paintHeat(){
  H.dirty=false;
  if(!FEED||!ROOT||S.page!=='mesa')return;
  const per=H.per;
  $$('[data-ht]').forEach(e=>{const p=per[e.dataset.ht];e.innerHTML=svgUser()+(p?p.users.size+' · '+money(p.amount):'0')});
  $$('[data-hts]').forEach(e=>{const p=per[e.dataset.hts];e.innerHTML=svgUser()+(p?p.users.size:0)});
  $$('[data-bar]').forEach(e=>{const [a,b]=e.dataset.bar.split('|'),pa=per[a]||{users:new Set(),amount:0},pb=per[b]||{users:new Set(),amount:0},t=pa.amount+pb.amount,fa=t?pa.amount/t:.5;
    e.querySelector('.hb-a').style.flexGrow=fa;e.querySelector('.hb-b').style.flexGrow=1-fa;
    e.querySelector('[data-hb=a]').innerHTML=money(pa.amount)+' · '+svgUser()+pa.users.size+' · '+Math.round(fa*100)+'%';
    e.querySelector('[data-hb=b]').innerHTML=Math.round((1-fa)*100)+'% · '+svgUser()+pb.users.size+' · '+money(pb.amount)});
  const users=new Set(H.bets.map(b=>b.user)),amt=H.bets.reduce((x,b)=>x+b.amount,0);
  const hk=k=>$('[data-hk='+k+']');if(hk('users')){hk('users').textContent=users.size;hk('bets').textContent=H.bets.length;hk('amount').textContent=money(amt)}
  const tk=$('#ticker');
  if(tk){const last=+(tk.dataset.last||0),nw=t=>t.id>last?' nw':'';tk.dataset.last=H.seq;
  const kol=(globalThis.R28Social&&R28Social.active&&S.round)?R28Social.tickerHTML(S.round.period,S.room):'';
  const body=H.ticker.slice(0,8).map(t=>t.k==='big'?`<li class="big${nw(t)}">${svgTrophy()}<span><b>${esc(t.user)}</b> ganó <b>${money(t.amount)}</b> con ${esc(t.option)}</span></li>`:`<li class="${nw(t)}"><i class="${KCLASS[t.option]||''}"></i><span><b>${esc(t.user)}</b> apostó <b>${money(t.amount)}</b> a ${esc(t.option)}</span></li>`).join('')||(kol?'':'<li class="mut">Esperando apuestas de la ronda…</li>');
  tk.innerHTML=kol+body;}
}

/* ---------- widgets externos (lobby del sitio anfitrión, fuera del shadow DOM) ---------- */
function updateExternal(){
  const els=document.querySelectorAll('[data-r28-live]');if(!els.length)return;
  const left=Math.max(0,Math.ceil((S.phaseEnd-Date.now())/1000)),h=hist();
  els.forEach(e=>{const ph=e.querySelector('[data-r28-ph]');if(ph)ph.textContent=phaseLabel()+' · '+left+'s';
    const st=e.querySelector('[data-r28-strip]');if(st){const k=h.slice(0,6).map(x=>x.sum).join(',');if(st.dataset.k!==k){st.dataset.k=k;st.innerHTML=h.slice(0,6).map(x=>`<i class="${x.sum>=14?'g':'c'}">${x.sum}</i>`).join('')}}});
}

function mount(host){
  const sr=host.shadowRoot||host.attachShadow({mode:'open'});
  sr.innerHTML='<style>'+(globalThis.R28_CSS||'')+'</style>'+shellHTML();
  ROOT=sr;WRAP=sr.querySelector('.r28');
  if(I18N)I18N.attach(sr);                 // traduce el texto visible; no toca el estado del juego
  if(!sr.__r28){sr.__r28=true;sr.addEventListener('click',onClick);sr.addEventListener('change',onChange);sr.addEventListener('keydown',onKey);
    sr.addEventListener('click',ev=>{const t=ev.target;if(t&&t.id==='modal')closeModal()})}
  render();
}
let started=false;
async function init(opts){
  Object.assign(CFG,opts||{});
  FEED=CFG.betsFeed||(CFG.demoHeat===true&&globalThis.R28Heat?globalThis.R28Heat.createSimulatedFeed():null);
  if(globalThis.R28Social)R28Social.activate(CFG);
  if(CFG.shell==='mxfox'&&S.page==='inicio')S.page='mesa';
  if(started)return;started=true;
  await seedHistory('1m');
  if(globalThis.R28Social)R28Social.bindHistory(S.hist);
  await newRound();
  S.ready=true;render();
  setInterval(tick,200);
}
// Cambio de idioma: solo se vuelve a pintar (horas con el nuevo locale); ronda, saldo, apuestas y relojes siguen igual.

if(!globalThis.__r28KeyBound){globalThis.__r28KeyBound=true;document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ROOT)closeModal()})}
globalThis.R28={init,mount,lobbyCard,state:S,heat:H,config:CFG,placeDirect};
globalThis.__R28=S;globalThis.__R28H=H;
})();
